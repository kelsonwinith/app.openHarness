function copyText(text, label) {
  const done = function () { toast(label || 'Copied to clipboard', '', 'success'); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text); done(); });
  } else {
    fallbackCopy(text); done();
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (err) {}
  ta.remove();
}

function syncToastPosition() {
  const root = $('#toastRoot');
  if (!root) return;
  const besideDrawer = ui.drawerOpen && window.innerWidth >= 900 && !ui.drawerExpanded;
  root.style.right = besideDrawer ? '516px' : '16px';
  root.style.bottom = ui.drawerOpen ? '84px' : '16px';
}

function toast(title, description, variant) {
  syncToastPosition();
  const icon = variant === 'success' ? 'CheckCircle2' : variant === 'destructive' ? 'TriangleAlert' : 'Info';
  const color = variant === 'success' ? 'text-emerald-600 dark:text-emerald-400' : variant === 'destructive' ? 'text-red-600 dark:text-red-400' : 'text-muted-foreground';
  const el = document.createElement('div');
  el.className = 'pointer-events-auto flex w-full items-start gap-2.5 rounded-lg border bg-popover p-3 shadow-lg animate-toast';
  el.innerHTML = '<span class="mt-0.5 shrink-0 ' + color + '">' + ic(icon, 'h-4 w-4') + '</span>' +
    '<div class="min-w-0 flex-1"><div class="text-[12px] font-medium leading-snug">' + esc(title) + '</div>' +
    (description ? '<div class="mt-0.5 text-[10.5px] leading-relaxed text-muted-foreground">' + esc(description) + '</div>' : '') + '</div>' +
    '<button class="btn btn-ghost btn-icon-sm -mr-1 -mt-1 shrink-0" aria-label="Dismiss">' + ic('X', 'h-3 w-3') + '</button>';
  el.querySelector('button').addEventListener('click', function () { el.remove(); });
  $('#toastRoot').appendChild(el);
  const root = $('#toastRoot');
  while (root.children.length > 2) root.firstElementChild.remove();
  refreshIcons();
  setTimeout(function () {
    el.classList.add('opacity-0');
    el.style.transition = 'opacity .2s ease';
    setTimeout(function () { el.remove(); }, 220);
  }, 3400);
}

/* ------------------------------- events ------------------------------ */

document.addEventListener('click', function (e) {
  const mi = e.target.closest('[data-mi]');
  if (mi) {
    e.preventDefault();
    const item = currentMenu[Number(mi.dataset.mi)];
    closeMenu();
    if (item && !item.disabled && item.action) item.action();
    return;
  }
  if (!e.target.closest('#menuRoot')) closeMenu();

  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const wfId = el.dataset.wf;
  const stepId = el.dataset.step;
  const skillId = el.dataset.skill;
  const runId = el.dataset.run;

  switch (act) {
    case 'nav':
      if (el.dataset.view) setView(el.dataset.view);
      break;
    case 'toggle-list':
      ui.listOpen = !ui.listOpen;
      $('#sidebar').classList.toggle('open', ui.listOpen);
      $('#sidebarScrim').classList.toggle('hidden', !ui.listOpen);
      break;
    case 'select-workflow':
      if (wfId) selectWorkflow(wfId);
      break;
    case 'new-workflow':
      openWorkflowDialog(null);
      break;
    case 'begin-rename':
      if (wfId) beginRename(wfId);
      break;
    case 'workflow-menu':
      openWorkflowMenu(wfId, el);
      break;
    case 'run-workflow':
      openLaunchDialog(wfId);
      break;
    case 'open-live-run': {
      const live = liveRun();
      const latest = state.runs.slice().sort(function (a, b) { return b.startedAt - a.startedAt; })[0];
      if (live) openRun(live.id);
      else if (latest) openRun(latest.id);
      break;
    }
    case 'add-skill':
      openAddSkillDialog(wfId);
      break;
    case 'pick-skill':
      if (skillId) pickSkill(skillId);
      break;
    case 'add-skill-cat':
      ui.addSkillCat = el.dataset.cat;
      renderAddSkillCats();
      renderAddSkillList();
      break;
    case 'step-settings':
      openStepDialog(wfId, stepId);
      break;
    case 'step-menu':
      openStepMenu(wfId, stepId, el);
      break;
    case 'gate-toggle':
      toggleGate(wfId, stepId);
      break;
    case 'clear-override': {
      const ta = $('#stepInstructions');
      if (ta) { ta.value = ''; ta.focus(); }
      break;
    }
    case 'skill-cat':
      ui.skillCat = el.dataset.cat;
      renderSkillCats();
      renderSkillGrid();
      break;
    case 'new-skill':
      openSkillDialog(null);
      break;
    case 'edit-skill':
      openSkillDialog(skillById(skillId));
      break;
    case 'skill-menu':
      openSkillMenu(skillId, el);
      break;
    case 'set-theme':
      setTheme(el.dataset.theme);
      break;
    case 'theme-menu':
      openMenu(el, [
        { label: 'Light', icon: 'Sun', checked: state.theme === 'light', action: function () { setTheme('light'); } },
        { label: 'Dark', icon: 'Moon', checked: state.theme === 'dark', action: function () { setTheme('dark'); } },
        { label: 'System', icon: 'Monitor', checked: state.theme === 'system', action: function () { setTheme('system'); } }
      ]);
      break;
    case 'harness-menu':
      openMenu(el, HARNESSES.map(function (h) {
        return {
          label: h.name, icon: h.icon, hint: 'v' + h.version, checked: state.defaultHarness === h.id,
          action: function () { setDefaultHarness(h.id); }
        };
      }).concat([{ sep: true }, { label: 'Manage in settings', icon: 'Settings2', action: function () { setView('settings'); } }]));
      break;
    case 'set-default-harness':
      setDefaultHarness(el.dataset.harness);
      break;
    case 'set-speed':
      setSpeed(Number(el.dataset.speed));
      break;
    case 'reset-demo':
      confirmDialog({
        title: 'Reset demo data?',
        body: 'All workflows, skills, runs, and local edits will be replaced with the seeded demo. This cannot be undone.',
        confirmLabel: 'Reset demo',
        warning: 'Your theme and harness preference are kept.',
        onConfirm: resetDemo
      });
      break;
    case 'close-dialog':
      closeDialog();
      break;
    case 'confirm-action': {
      const fn = confirmHandler;
      closeDialog();
      if (fn) fn();
      break;
    }
    case 'pick-launch-harness':
      ui.launchHarness = el.dataset.harness;
      renderLaunchBody();
      break;
    case 'copy-command': {
      const wf = workflowById(ui.launchWfId || state.activeWorkflowId);
      if (wf) copyText(commandFor(ui.launchHarness, wf), 'Command copied');
      break;
    }
    case 'start-run':
      startRun(ui.launchWfId, ui.launchHarness);
      break;
    case 'close-drawer':
      ui.drawerOpen = false;
      ui.drawerAnimate = false;
      ui.autoScroll = true;
      renderDrawer();
      break;
    case 'expand-drawer':
      ui.drawerExpanded = !ui.drawerExpanded;
      renderDrawer();
      break;
    case 'pause-run':
      pauseRun();
      break;
    case 'resume-run':
      resumeRun();
      break;
    case 'stop-run':
      confirmDialog({
        title: 'Stop this run?',
        body: 'The current step will be marked stopped. You can start a fresh run afterwards.',
        confirmLabel: 'Stop run',
        onConfirm: stopRunNow
      });
      break;
    case 'approve-gate':
      approveGate();
      break;
    case 'reject-gate':
      confirmDialog({
        title: 'Reject the gate?',
        body: 'The run will stop and will not execute the remaining steps.',
        confirmLabel: 'Reject and stop',
        onConfirm: rejectGate
      });
      break;
    case 'run-speed':
      cycleRunSpeed();
      break;
    case 'run-again': {
      const target = workflowById(wfId || (activeRun() && activeRun().workflowId));
      if (target) openLaunchDialog(target.id);
      else toast('Workflow missing', 'This workflow no longer exists.', 'destructive');
      break;
    }
    case 'open-run':
      if (runId) openRun(runId);
      break;
    case 'delete-run': {
      e.stopPropagation();
      const run = runById(runId);
      if (!run) break;
      if (isLive(run)) { toast('Stop the run first', 'Live runs cannot be deleted.', 'destructive'); break; }
      confirmDialog({
        title: 'Delete this run?',
        body: 'The run record and its activity history will be removed. Workflows and skills are unaffected.',
        confirmLabel: 'Delete run',
        onConfirm: function () {
          state.runs = state.runs.filter(function (r) { return r.id !== runId; });
          if (ui.activeRunId === runId) { ui.activeRunId = null; ui.drawerOpen = false; }
          save(); render();
          toast('Run deleted');
        }
      });
      break;
    }
    case 'new-run': {
      const wf = activeWorkflow() || state.workflows[0];
      if (wf) openLaunchDialog(wf.id);
      else toast('No workflow yet', 'Create a workflow before starting a run.', 'destructive');
      break;
    }
  }
});

  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const onChange = function () { if (state.theme === 'system') { applyTheme(); render(); } };
  if (mq.addEventListener) mq.addEventListener('change', onChange);
  else if (mq.addListener) mq.addListener(onChange);
}

/* -------------------------------- boot ------------------------------- */

if (!state.activeWorkflowId && state.workflows[0]) state.activeWorkflowId = state.workflows[0].id;
applyTheme();
render();
setInterval(function () {
  const run = activeRun();
  if (!run || !ui.drawerOpen) return;
  const text = fmtClock(elapsedMs(run));
  $$('[data-live-elapsed]').forEach(function (el) { el.textContent = text; });
}, 1000);

</script>
</body>
</html>
