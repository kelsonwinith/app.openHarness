          destructive: { DEFAULT: 'hsl(var(--destructive))', foreground: 'hsl(var(--destructive-foreground))' },
          muted: { DEFAULT: 'hsl(var(--muted))', foreground: 'hsl(var(--muted-foreground))' },
          accent: { DEFAULT: 'hsl(var(--accent))', foreground: 'hsl(var(--accent-foreground))' },
          popover: { DEFAULT: 'hsl(var(--popover))', foreground: 'hsl(var(--popover-foreground))' },

<script>
  (function () {
    try {
      var raw = localStorage.getItem('relay.state.v1');
      var pref = raw ? (JSON.parse(raw).theme || 'system') : 'system';
      var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('dark');
    } catch (e) {}
  })();
</script>

let seq = 0;
function uid(prefix) {
  seq += 1;
  return prefix + '_' + Date.now().toString(36) + seq.toString(36) + Math.random().toString(36).slice(2, 6);
}

function step(skillId, gate) {
  return { id: uid('step'), skillId: skillId, gate: !!gate, instructions: '' };
}

function skillName(id) {
  const s = SKILLS.find(function (x) { return x.id === id; });
  return s ? s.name : 'Unknown skill';
}

function buildSeedRun(wf, harnessId, startedAt) {
  let t = startedAt;
  const steps = wf.steps.map(function (s) {
    const plan = PLANS[s.skillId] || GENERIC_PLAN;
    const start = t;
    const activities = plan.slice(0, 3).map(function (p, j) {
      return Object.assign({}, p, { at: start + j * 13000 });
    });
    if (s.gate) activities.push({ k: 'gate-ok', gate: true, text: 'Approved by you — continuing', at: start + 48000 });
    t = start + 71000;
    return {
      id: uid('rst'), stepId: s.id, skillId: s.skillId, name: skillName(s.skillId),
      gate: !!s.gate, instructions: '', status: 'done', activities: activities,
      startedAt: start, endedAt: t
    };
  });
  return {
    id: uid('run'), workflowId: wf.id, workflowName: wf.name, harnessId: harnessId,
    status: 'completed', startedAt: startedAt, endedAt: t, pausedMs: 0, pausedAt: null,
    currentStep: steps.length, speed: 1, steps: steps
  };
}

function buildSeed() {
  const now = Date.now();
  const feature = {
    id: uid('wf'), name: 'Feature delivery',
    description: 'Discovery through verified implementation, with human approval before requirements and before code.',
    steps: [
      step('project-discovery', false),
      step('requirement-discovery', true),
      step('requirements-docs', false),
      step('implementation-strategy', true),
      step('architecture-adr', false),
      step('implementation', false),
      step('qa-verification', false)
    ],
    updatedAt: now
  };
  const bug = {
    id: uid('wf'), name: 'Bug fix',
    description: 'Reproduce the failure, isolate the cause, patch it, then lock it down with a regression test.',
    steps: [
      step('repro-bug', false),
      step('isolate-cause', true),
      step('patch-fix', false),
      step('regression-check', false)
    ],
    updatedAt: now - 86400000
  };
  const docs = {
    id: uid('wf'), name: 'Docs refresh',
    description: 'Audit documentation against the implementation, resync API contracts, and publish release notes.',
    steps: [
      step('docs-audit', false),
      step('api-contract-sync', false),
      step('release-notes', false)
    ],
    updatedAt: now - 172800000
  };
  const skills = SKILLS.map(function (s) { return Object.assign({}, s); });
  return {
    version: 1,
    theme: 'system',
    view: 'workflows',
    defaultHarness: 'opencode',
    simSpeed: 1,
    activeWorkflowId: feature.id,
    skills: skills,
    workflows: [feature, bug, docs],
    runs: [buildSeedRun(feature, 'opencode', now - 1000 * 60 * 60 * 5)]
  };
}

function loadState() {
  let parsed = null;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) parsed = JSON.parse(raw);
  } catch (err) { parsed = null; }
  if (!parsed || parsed.version !== 1 || !Array.isArray(parsed.workflows) || !Array.isArray(parsed.skills)) {
    return buildSeed();
  }
  parsed.runs = Array.isArray(parsed.runs) ? parsed.runs : [];
  parsed.view = ['workflows', 'runs', 'skills', 'settings'].indexOf(parsed.view) >= 0 ? parsed.view : 'workflows';
  parsed.theme = ['light', 'dark', 'system'].indexOf(parsed.theme) >= 0 ? parsed.theme : 'system';
  parsed.simSpeed = [1, 2, 4].indexOf(parsed.simSpeed) >= 0 ? parsed.simSpeed : 1;
  if (!parsed.defaultHarness) parsed.defaultHarness = 'opencode';
  if (!parsed.activeWorkflowId && parsed.workflows[0]) parsed.activeWorkflowId = parsed.workflows[0].id;
  parsed.runs.forEach(function (run) {
    if (['running', 'waiting', 'paused'].indexOf(run.status) >= 0) {
      run.status = 'stopped';
      run.endedAt = Date.now();
      run.pausedAt = null;
      const st = run.steps[run.currentStep];
      if (st && ['running', 'waiting', 'pending'].indexOf(st.status) >= 0) {
        st.status = 'stopped';
        st.endedAt = Date.now();
        st.activities.push({ k: 'stop', text: 'Session ended before the run completed', at: Date.now() });
      }
    }
  });
  return parsed;
}

function esc(value) {

  });
}

function isLive(run) { return !!run && ['running', 'waiting', 'paused'].indexOf(run.status) >= 0; }

function fmtDur(ms) {
  if (!ms || ms < 1000) return '0s';
  const s = Math.round(ms / 1000);
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60);
  const rs = s % 60;
  return rs ? m + 'm ' + rs + 's' : m + 'm';
}

function fmtClock(ms) {
  const total = Math.max(0, Math.floor((ms || 0) / 1000));
  const m = Math.floor(total / 60);
  const s = total % 60;
  return m + ':' + String(s).padStart(2, '0');
}

function fmtTime(ts) {
  const d = new Date(ts);
  return [d.getHours(), d.getMinutes(), d.getSeconds()].map(function (n) { return String(n).padStart(2, '0'); }).join(':');
}

function fmtAgo(ts) {
  const diff = Date.now() - ts;
  const min = Math.round(diff / 60000);
  if (min < 1) return 'just now';
  if (min < 60) return min + 'm ago';
  const h = Math.round(min / 60);
  if (h < 24) return h + 'h ago';
  const d = Math.round(h / 24);
  return d + 'd ago';
}

function slugify(text) {
  return String(text).toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}

function elapsedMs(run) {
  if (!run) return 0;
  const end = run.endedAt || Date.now();
  let paused = run.pausedMs || 0;
  if (run.status === 'paused' && run.pausedAt) paused += Date.now() - run.pausedAt;
  return Math.max(0, end - run.startedAt - paused);
}

function planFor(skillId) { return PLANS[skillId] || GENERIC_PLAN; }

function toolName(harnessId, kind) {
  const map = TOOL_NAMES[harnessId] || TOOL_NAMES.opencode;
  return map[kind] || kind;
}

function commandFor(harnessId, wf) {
  const slug = slugify(wf.name) || 'workflow';
  if (harnessId === 'codex') return 'codex exec --workflow ' + slug + ' --ask-for-approval on-request';
  if (harnessId === 'antigravity') return 'antigravity run --workflow ' + slug + ' --approval manual';
  if (harnessId === 'claude') return 'claude --workflow ' + slug + ' --permission-mode plan';
  return 'opencode run --workflow ' + slug + ' --gates manual';
}

}

      '<span data-act="workflow-menu" data-wf="' + w.id + '" role="button" tabindex="0" aria-label="Workflow menu" class="mt-0.5 grid h-5 w-5 shrink-0 place-items-center rounded text-muted-foreground opacity-0 transition hover:bg-accent group-hover:opacity-100">' +

function renderMain() {
  const main = $('#main');
  if (state.view === 'runs') { renderRuns(main); return; }
  if (state.view === 'skills') { renderSkills(main); return; }
  if (state.view === 'settings') { renderSettings(main); return; }
  const wf = activeWorkflow();
  if (!wf) {
    main.innerHTML = '<div class="grid h-full place-items-center p-8"><div class="max-w-sm text-center">' +
      '<div class="mx-auto grid h-12 w-12 place-items-center rounded-full border bg-muted/40 text-muted-foreground">' + ic('Workflow', 'h-5 w-5') + '</div>' +
      '<h1 class="mt-4 text-[17px] font-semibold tracking-tight">No workflow selected</h1>' +

    '</div></div>';
    refreshIcons();
    return;
  }
  const gates = wf.steps.filter(function (s) { return s.gate; }).length;
  const unique = new Set(wf.steps.map(function (s) { return s.skillId; })).size;
  const est = Math.max(2, Math.round(wf.steps.length * 2.2));
  const lastRun = state.runs.filter(function (r) { return r.workflowId === wf.id; }).sort(function (a, b) { return b.startedAt - a.startedAt; })[0];
  const live = state.runs.find(function (r) { return r.workflowId === wf.id && ['running', 'waiting', 'paused'].indexOf(r.status) >= 0; });

    const desc = skill ? skill.description : 'This skill is missing from the library.';
    const cat = skill ? (CATEGORIES[skill.category] || { label: 'Skill' }).label : 'Missing';
    const actions =
      '<button class="btn btn-ghost btn-icon-sm ' + (s.gate ? 'text-amber-600 dark:text-amber-400' : '') + '" data-act="gate-toggle" data-wf="' + wf.id + '" data-step="' + s.id + '" title="' + (s.gate ? 'Remove approval gate' : 'Require approval after this step') + '">' + ic('Hand', 'h-3.5 w-3.5') + '</button>' +
      '<button class="btn btn-ghost btn-icon-sm" data-act="step-menu" data-wf="' + wf.id + '" data-step="' + s.id + '" title="Step actions">' + ic('MoreHorizontal', 'h-3.5 w-3.5') + '</button>';
    return '<li draggable="true" data-drag="' + s.id + '" class="group flex gap-2.5 sm:gap-3">' +
      '<div class="flex flex-col items-center">' +
        '<span class="mt-3 grid h-7 w-7 shrink-0 place-items-center rounded-full border bg-background font-mono text-[10.5px] text-muted-foreground">' + (i + 1) + '</span>' +
        (i < wf.steps.length - 1 ? '<span class="mt-2 w-px flex-1 bg-border"></span>' : '') +
      '</div>' +
      '<div class="mb-2.5 min-w-0 flex-1 rounded-lg border bg-card px-3 py-3 shadow-sm transition hover:border-foreground/20 sm:px-3.5">' +
        '<div class="flex items-start gap-2.5">' +
          '<span class="mt-0.5 grid h-7 w-7 shrink-0 place-items-center rounded-md bg-muted text-muted-foreground">' + ic(skill ? skill.icon : 'CircleHelp', 'h-3.5 w-3.5') + '</span>' +
          '<button class="min-w-0 flex-1 text-left" data-act="step-settings" data-wf="' + wf.id + '" data-step="' + s.id + '">' +
            '<span class="flex flex-wrap items-center gap-x-2 gap-y-1">' +
              '<span class="text-[13px] font-medium">' + esc(name) + '</span>' +
              '<span class="badge badge-muted">' + cat + '</span>' +
              (s.gate ? '<span class="badge badge-gate">' + ic('Hand', 'h-2.5 w-2.5') + 'Approval gate</span>' : '') +
              (s.instructions ? '<span class="badge badge-blue" title="This step overrides the skill instructions">' + ic('MessageSquareText', 'h-2.5 w-2.5') + 'Custom</span>' : '') +
            '</span>' +
            '<span class="mt-1 block line-clamp-2 text-[11.5px] leading-relaxed text-muted-foreground">' + esc(desc) + '</span>' +
          '</button>' +
          '<span class="hidden shrink-0 items-center gap-0.5 opacity-0 transition group-hover:opacity-100 group-focus-within:opacity-100 sm:flex">' +
            '<span class="grid h-7 w-6 cursor-grab place-items-center text-muted-foreground/60 active:cursor-grabbing" title="Drag to reorder">' + ic('GripVertical', 'h-3.5 w-3.5') + '</span>' +
            actions +
          '</span>' +
        '</div>' +
        '<div class="mt-2 flex items-center justify-end gap-0.5 border-t border-border/60 pt-2 sm:hidden">' + actions + '</div>' +
      '</div>' +
    '</li>';

  main.innerHTML = '<div class="mx-auto w-full max-w-[920px] px-5 py-7 lg:px-9 lg:py-9">' +
    '<div class="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between sm:gap-5">' +
      '<div class="min-w-0 flex-1">' +
        '<div class="mb-1.5 flex items-center gap-1.5 text-[10.5px] text-muted-foreground"><span>Workflows</span>' + ic('ChevronRight', 'h-3 w-3') + '<span>Editor</span></div>' +
        title +
        '<p class="mt-2 max-w-2xl text-[12.5px] leading-relaxed text-muted-foreground">' + esc(wf.description || 'No description yet.') + '</p>' +
      '</div>' +
      '<div class="flex shrink-0 items-center gap-2 sm:pt-5">' +
        '<button class="btn btn-ghost btn-icon" data-act="workflow-menu" data-wf="' + wf.id + '" aria-label="Workflow actions">' + ic('MoreHorizontal', 'h-4 w-4') + '</button>' +
        (live
          ? '<button class="btn btn-primary" data-act="open-live-run">' + ic('Loader2', 'h-3.5 w-3.5 animate-spin') + 'View run</button>'
          : '<button class="btn btn-primary" data-act="run-workflow" data-wf="' + wf.id + '" ' + (wf.steps.length ? '' : 'disabled') + '>' + ic('Play', 'h-3.5 w-3.5 fill-current') + 'Run workflow</button>') +
      '</div>' +
    '</div>' +
    '<div class="mt-5 flex flex-wrap items-center gap-x-5 gap-y-2 text-[11.5px] text-muted-foreground">' +
      '<span class="inline-flex items-center gap-1.5">' + ic('ListOrdered', 'h-3.5 w-3.5') + wf.steps.length + ' steps</span>' +
      '<span class="inline-flex items-center gap-1.5">' + ic('Hand', 'h-3.5 w-3.5') + gates + ' approval gate' + (gates === 1 ? '' : 's') + '</span>' +
      '<span class="inline-flex items-center gap-1.5">' + ic('Layers', 'h-3.5 w-3.5') + unique + ' skill' + (unique === 1 ? '' : 's') + '</span>' +
      '<span class="inline-flex items-center gap-1.5">' + ic('Clock3', 'h-3.5 w-3.5') + '~' + est + ' min</span>' +
      '<span class="inline-flex items-center gap-1.5">' + ic('History', 'h-3.5 w-3.5') + (lastRun ? 'Last run ' + fmtAgo(lastRun.startedAt) : 'Never run') + '</span>' +
    '</div>' +
    '<div class="mt-8 flex items-end justify-between gap-4">' +
      '<div><h2 class="text-[13px] font-semibold">Steps</h2><p class="mt-0.5 text-[11.5px] text-muted-foreground">Ordered skills the harness will execute. Drag to reorder.</p></div>' +
      '<button class="btn btn-outline btn-sm" data-act="add-skill" data-wf="' + wf.id + '">' + ic('Plus', 'h-3.5 w-3.5') + 'Add skill</button>' +
    '</div>' +
    (wf.steps.length
      ? '<ol id="stepList" class="mt-3">' + stepsHtml + '</ol>'
      : '<div class="mt-3 rounded-lg border border-dashed p-8 text-center">' +
          '<div class="mx-auto grid h-10 w-10 place-items-center rounded-full bg-muted text-muted-foreground">' + ic('Plus', 'h-4 w-4') + '</div>' +
          '<p class="mt-3 text-[13px] font-medium">This workflow has no steps</p>' +
          '<p class="mx-auto mt-1 max-w-xs text-[11.5px] leading-relaxed text-muted-foreground">Add skills from the library. The harness executes them top to bottom.</p>' +
          '<button class="btn btn-outline btn-sm mt-4" data-act="add-skill" data-wf="' + wf.id + '">' + ic('Plus', 'h-3.5 w-3.5') + 'Add first skill</button>' +
        '</div>') +
    '<div class="mt-2 flex items-center gap-2 text-[10.5px] text-muted-foreground">' +
      ic('Info', 'h-3 w-3') + 'Changes are saved locally. Runs snapshot the workflow at launch.' +
    '</div>' +
  '</div>';

  refreshIcons();
}

function renderRuns(main) {
  const runs = state.runs.slice().sort(function (a, b) { return b.startedAt - a.startedAt; });
  const wf = activeWorkflow();
  const rows = runs.map(function (run) {
    const harness = harnessById(run.harnessId);
    const done = run.steps.filter(function (s) { return s.status === 'done'; }).length;
    return '<tr class="cursor-pointer border-t transition hover:bg-muted/30" data-act="open-run" data-run="' + run.id + '">' +
      '<td class="px-4 py-3">' +
        '<div class="flex items-center gap-2.5"><span class="grid h-7 w-7 shrink-0 place-items-center rounded-md border bg-muted/40 text-muted-foreground">' + ic('Workflow', 'h-3.5 w-3.5') + '</span>' +
        '<span class="min-w-0"><span class="block truncate text-[12.5px] font-medium">' + esc(run.workflowName) + '</span>' +
        '<span class="block text-[10.5px] text-muted-foreground">' + done + '/' + run.steps.length + ' steps complete</span></span></div>' +
      '</td>' +
      '<td class="hidden px-4 py-3 text-[11.5px] text-muted-foreground md:table-cell"><span class="inline-flex items-center gap-1.5">' + ic(harness.icon, 'h-3.5 w-3.5') + esc(harness.name) + '</span></td>' +
      '<td class="px-4 py-3">' + statusBadge(run.status) + '</td>' +
      '<td class="hidden px-4 py-3 font-mono text-[11px] text-muted-foreground lg:table-cell">' + (run.endedAt ? fmtDur(elapsedMs(run)) : fmtClock(elapsedMs(run))) + '</td>' +
      '<td class="hidden px-4 py-3 text-[11.5px] text-muted-foreground sm:table-cell">' + fmtAgo(run.startedAt) + '</td>' +
      '<td class="px-4 py-3 text-right">' +
        '<button class="btn btn-ghost btn-icon-sm" data-act="delete-run" data-run="' + run.id + '" title="Delete run" aria-label="Delete run">' + ic('Trash2', 'h-3.5 w-3.5') + '</button>' +
      '</td>' +
    '</tr>';
  }).join('');

  main.innerHTML = '<div class="mx-auto w-full max-w-[1080px] px-5 py-7 lg:px-9 lg:py-9">' +
    '<div class="flex items-start justify-between gap-4">' +
      '<div><h1 class="text-[22px] font-semibold tracking-[-0.02em]">Runs</h1>' +
        '<p class="mt-1 text-[12.5px] text-muted-foreground">Executions started from this console, newest first.</p></div>' +
      '<button class="btn btn-primary" data-act="new-run" ' + (wf ? '' : 'disabled') + '>' + ic('Play', 'h-3.5 w-3.5 fill-current') + 'New run</button>' +
    '</div>' +
    (runs.length
      ? '<div class="card mt-6 overflow-hidden">' +
          '<table class="w-full text-left"><thead class="bg-muted/40"><tr class="text-[10.5px] text-muted-foreground">' +
            '<th class="px-4 py-2.5 font-medium">Workflow</th>' +
            '<th class="hidden px-4 py-2.5 font-medium md:table-cell">Harness</th>' +
            '<th class="px-4 py-2.5 font-medium">Status</th>' +
            '<th class="hidden px-4 py-2.5 font-medium lg:table-cell">Duration</th>' +
            '<th class="hidden px-4 py-2.5 font-medium sm:table-cell">Started</th>' +
            '<th class="px-4 py-2.5"></th>' +
          '</tr></thead><tbody>' + rows + '</tbody></table>' +
        '</div>'
      : '<div class="mt-6 rounded-lg border border-dashed p-10 text-center">' +
          '<div class="mx-auto grid h-10 w-10 place-items-center rounded-full bg-muted text-muted-foreground">' + ic('History', 'h-4 w-4') + '</div>' +
          '<p class="mt-3 text-[13px] font-medium">No runs yet</p>' +
          '<p class="mt-1 text-[11.5px] text-muted-foreground">Launch a workflow to watch each step stream in.</p>' +
          '<button class="btn btn-outline btn-sm mt-4" data-act="new-run" ' + (wf ? '' : 'disabled') + '>' + ic('Play') + 'Start a run</button>' +
        '</div>') +
    '<div class="mt-3 flex items-center gap-2 text-[10.5px] text-muted-foreground">' + ic('Info', 'h-3 w-3') + 'Demo runs are simulated in the browser and capped at 40 records.</div>' +
  '</div>';
  refreshIcons();
}

function renderSkills(main) {
  main.innerHTML = '<div class="mx-auto w-full max-w-[1120px] px-5 py-7 lg:px-9 lg:py-9">' +
    '<div class="flex items-start justify-between gap-4">' +
      '<div><h1 class="text-[22px] font-semibold tracking-[-0.02em]">Skill library</h1>' +
        '<p class="mt-1 max-w-xl text-[12.5px] leading-relaxed text-muted-foreground">Reusable instructions that workflows reference. Edit once and every workflow picks it up.</p></div>' +

      '<div class="relative w-full lg:max-w-[290px]">' +
        '<span class="pointer-events-none absolute left-2.5 top-1/2 -translate-y-1/2 text-muted-foreground/70">' + ic('Search', 'h-3.5 w-3.5') + '</span>' +
        '<input id="skillSearch" class="input h-9 pl-8 text-[12px]" placeholder="Search skills" value="' + esc(ui.skillSearch) + '" />' +
      '</div>' +
      '<div id="skillCats" class="flex flex-wrap gap-1"></div>' +

    '<div class="mt-4 flex items-center justify-between"><span id="skillCount" class="text-[11px] text-muted-foreground"></span>' +

function renderSkillCats() {
  const wrap = $('#skillCats');
  if (!wrap) return;
  const all = [['all', 'All']].concat(Object.keys(CATEGORIES).map(function (k) { return [k, CATEGORIES[k].label]; }));
  wrap.innerHTML = all.map(function (pair) {
    const active = ui.skillCat === pair[0];
    const count = pair[0] === 'all' ? state.skills.length : state.skills.filter(function (s) { return s.category === pair[0]; }).length;
    return '<button class="badge ' + (active ? 'border-primary bg-primary text-primary-foreground' : 'bg-background text-muted-foreground hover:bg-accent') + '" data-act="skill-cat" data-cat="' + pair[0] + '">' +
      pair[1] + '<span class="opacity-60">' + count + '</span></button>';
  }).join('');
  refreshIcons();
}

function renderSkillGrid() {
  const grid = $('#skillGrid');
  if (!grid) return;
  const q = ui.skillSearch.trim().toLowerCase();
  const skills = state.skills.filter(function (s) {
    const catOk = ui.skillCat === 'all' || s.category === ui.skillCat;
    const qOk = !q || s.name.toLowerCase().indexOf(q) >= 0 || s.description.toLowerCase().indexOf(q) >= 0 || s.instructions.toLowerCase().indexOf(q) >= 0;
    return catOk && qOk;
  }).sort(function (a, b) { return a.name.localeCompare(b.name); });
  const countEl = $('#skillCount');
  if (countEl) countEl.textContent = skills.length + ' skill' + (skills.length === 1 ? '' : 's') + (ui.skillCat === 'all' && !q ? ' in library' : ' shown');
  if (!skills.length) {
    grid.innerHTML = '<div class="col-span-full rounded-lg border border-dashed p-10 text-center">' +
      '<div class="mx-auto grid h-10 w-10 place-items-center rounded-full bg-muted text-muted-foreground">' + ic('SearchX', 'h-4 w-4') + '</div>' +
      '<p class="mt-3 text-[13px] font-medium">No skills match</p><p class="mt-1 text-[11.5px] text-muted-foreground">Clear the search or create a new skill.</p>' +
      '<button class="btn btn-outline btn-sm mt-4" data-act="new-skill">' + ic('Plus') + 'New skill</button></div>';
    refreshIcons();
    return;
  }
  grid.innerHTML = skills.map(function (s) {
    const usage = state.workflows.filter(function (w) { return w.steps.some(function (st) { return st.skillId === s.id; }); }).length;
    return '<div class="group relative cursor-pointer rounded-lg border bg-card p-4 text-left shadow-sm transition hover:border-foreground/20 hover:shadow" data-act="edit-skill" data-skill="' + s.id + '">' +
      '<div class="flex items-start justify-between gap-2">' +
        '<span class="grid h-8 w-8 place-items-center rounded-md border bg-muted/40 text-muted-foreground">' + ic(s.icon, 'h-4 w-4') + '</span>' +
        '<button class="btn btn-ghost btn-icon-sm opacity-0 transition group-hover:opacity-100" data-act="skill-menu" data-skill="' + s.id + '" aria-label="Skill actions">' + ic('MoreHorizontal') + '</button>' +
      '</div>' +
      '<div class="mt-3 text-[13px] font-medium">' + esc(s.name) + '</div>' +
      '<p class="mt-1 line-clamp-2 min-h-[34px] text-[11.5px] leading-relaxed text-muted-foreground">' + esc(s.description) + '</p>' +
      '<div class="mt-3 flex items-center justify-between border-t pt-3 text-[10.5px] text-muted-foreground">' +
        '<span class="inline-flex items-center gap-1">' + ic('Workflow', 'h-3 w-3') + 'Used in ' + usage + ' workflow' + (usage === 1 ? '' : 's') + '</span>' +
        '<span class="badge badge-muted">' + (CATEGORIES[s.category] || { label: 'Skill' }).label + '</span>' +
      '</div>' +
    '</div>';
  }).join('');
  refreshIcons();
}

  const themeChoices = [
    ['light', 'Light', 'Sun', 'White surfaces, ink text'],
    ['dark', 'Dark', 'Moon', 'Low-light, high contrast'],
    ['system', 'System', 'Monitor', 'Follow the OS']

    let preview = '';

    } else {

      '<span class="grid h-7 w-7 place-items-center rounded-md border bg-background text-muted-foreground">' + ic(h.icon, 'h-3.5 w-3.5') + '</span>' +
      '<span class="min-w-0 flex-1"><span class="block text-[12px] font-medium">' + h.name + ' <span class="font-mono text-[10px] font-normal text-muted-foreground">v' + h.version + '</span></span>' +

      '<p class="mt-1 text-[12.5px] text-muted-foreground">Appearance, default harness, and the local demo store.</p></div>' +
    '<div class="mt-6 space-y-4">' +
      '<section class="card p-5">' +
        '<div class="flex items-start justify-between gap-4"><div><h2 class="text-[13px] font-semibold">Appearance</h2>' +
          '<p class="mt-0.5 text-[11px] text-muted-foreground">Light, dark, or follow the operating system.</p></div>' +
          '<span class="badge badge-muted">' + themeIcon().replace(/([A-Z])/g, ' $1').trim() + '</span></div>' +
        '<div class="mt-4 grid gap-2 sm:grid-cols-3">' + themeCards + '</div>' +
      '</section>' +
      '<section class="card p-5">' +
        '<div><h2 class="text-[13px] font-semibold">Default harness</h2>' +
          '<p class="mt-0.5 text-[11px] text-muted-foreground">Pre-selected when you launch a run. Workflows stay harness-agnostic.</p></div>' +
        '<div class="mt-3 space-y-0.5">' + harnessRows + '</div>' +
      '</section>' +
      '<section class="card p-5">' +
        '<div><h2 class="text-[13px] font-semibold">Simulation</h2>' +
          '<p class="mt-0.5 text-[11px] text-muted-foreground">Activity is simulated in-browser. Speed applies to new runs.</p></div>' +
        '<div class="mt-4 flex items-center gap-3"><div class="inline-flex rounded-md border p-0.5">' +
          [1, 2, 4].map(function (v) {
            return '<button class="rounded px-3 py-1 text-[11.5px] font-medium transition ' + (state.simSpeed === v ? 'bg-primary text-primary-foreground' : 'text-muted-foreground hover:text-foreground') + '" data-act="set-speed" data-speed="' + v + '">' + v + '×</button>';
          }).join('') +
        '</div><span class="text-[11px] text-muted-foreground">1× is roughly five seconds per step.</span></div>' +
      '</section>' +
      '<section class="card p-5">' +
        '<div class="flex flex-wrap items-center justify-between gap-3">' +
          '<div><h2 class="text-[13px] font-semibold">Demo data</h2>' +
            '<p class="mt-0.5 max-w-md text-[11px] leading-relaxed text-muted-foreground">Workflows, skills, runs, and preferences live in this browser only. Resetting restores the seeded workflows.</p></div>' +
          '<button class="btn btn-outline text-red-600 dark:text-red-400" data-act="reset-demo">' + ic('RotateCcw', 'h-3.5 w-3.5') + 'Reset demo</button>' +
        '</div>' +
        '<div class="mt-4 grid gap-2 text-[11px] text-muted-foreground sm:grid-cols-3">' +
          '<div class="flex items-center gap-2 rounded-md border bg-muted/25 px-2.5 py-2">' + ic('Workflow', 'h-3.5 w-3.5') + state.workflows.length + ' workflows</div>' +
          '<div class="flex items-center gap-2 rounded-md border bg-muted/25 px-2.5 py-2">' + ic('Layers', 'h-3.5 w-3.5') + state.skills.length + ' skills</div>' +
          '<div class="flex items-center gap-2 rounded-md border bg-muted/25 px-2.5 py-2">' + ic('History', 'h-3.5 w-3.5') + state.runs.length + (state.runs.length === 1 ? ' run' : ' runs') + '</div>' +
        '</div>' +
      '</section>' +
      '<p class="px-1 text-[10.5px] text-muted-foreground">Relay demo · workflows reference shared skills · runs are snapshotted at launch</p>' +
    '</div>' +
  '</div>';
  refreshIcons();
}

/* ------------------------------- drawer ------------------------------ */

const ACT_ICONS = {
  read: ['FileText', 'text-sky-600 dark:text-sky-400'],
  search: ['Search', 'text-sky-600 dark:text-sky-400'],
  glob: ['FolderSearch', 'text-sky-600 dark:text-sky-400'],
  run: ['Terminal', 'text-violet-600 dark:text-violet-400'],
  edit: ['Pencil', 'text-emerald-600 dark:text-emerald-400'],
  write: ['FilePlus2', 'text-emerald-600 dark:text-emerald-400'],
  plan: ['ListChecks', 'text-indigo-600 dark:text-indigo-400'],
  think: ['Sparkles', 'text-amber-600 dark:text-amber-400'],
  ask: ['MessageCircleQuestion', 'text-amber-600 dark:text-amber-400'],
  gate: ['Hand', 'text-amber-600 dark:text-amber-400'],
  'gate-ok': ['CheckCircle2', 'text-emerald-600 dark:text-emerald-400'],
  'gate-no': ['XCircle', 'text-red-600 dark:text-red-400'],
  stop: ['Square', 'text-muted-foreground'],
  done: ['Check', 'text-emerald-600 dark:text-emerald-400']
};

function activityIcon(kind) {
  const meta = ACT_ICONS[kind] || ['Dot', 'text-muted-foreground'];
  return ic(meta[0], 'h-3.5 w-3.5 ' + meta[1]);
}

function latestActivity(step) {
  if (!step) return null;
  for (let i = step.activities.length - 1; i >= 0; i--) {
    if (step.activities[i].k !== 'gate') return step.activities[i];
  }
  return null;
}

function renderDrawer() {
  const root = $('#drawerRoot');
  if (!ui.drawerOpen) { root.innerHTML = ''; ui.lastStatus = null; syncToastPosition(); return; }
  const run = runById(ui.activeRunId);
  if (!run) { ui.drawerOpen = false; root.innerHTML = ''; return; }
  const total = run.steps.length;
  const done = run.steps.filter(function (s) { return s.status === 'done'; }).length;
  const pct = total ? Math.round((done / total) * 100) : 0;
  const live = isLive(run);
  const waiting = run.status === 'waiting';
  const harness = harnessById(run.harnessId);
  const gates = run.steps.filter(function (s) { return s.gate; }).length;
  const cur = run.steps[run.currentStep] || run.steps[run.steps.length - 1] || null;

  const stepRows = run.steps.map(function (s, i) {
    const isCurrent = i === run.currentStep && ['running', 'waiting', 'paused'].indexOf(run.status) >= 0;
    const latest = latestActivity(s);
    return '<div class="flex items-center gap-2.5 px-3 py-2 ' + (isCurrent ? 'bg-muted/40' : '') + '">' +
      '<span class="shrink-0">' + stepStatusIcon(s.status) + '</span>' +
      '<div class="min-w-0 flex-1">' +
        '<div class="flex items-center gap-1.5"><span class="truncate text-[11.5px] ' + (s.status === 'pending' ? 'text-muted-foreground' : '') + '">' + (i + 1) + '. ' + esc(s.name) + '</span>' +
          (s.gate ? '<span class="shrink-0 text-amber-600 dark:text-amber-400" title="Approval gate">' + ic('Hand', 'h-2.5 w-2.5') + '</span>' : '') + '</div>' +
        (isCurrent && latest ? '<div class="mt-0.5 truncate text-[10px] text-muted-foreground">' + esc(latest.text) + '</div>' : '') +
      '</div>' +
      '<span class="shrink-0 font-mono text-[9.5px] text-muted-foreground">' + (s.endedAt && s.startedAt ? fmtDur(s.endedAt - s.startedAt) : '') + '</span>' +
    '</div>';
  }).join('');

  let feed = '';
  run.steps.forEach(function (s, i) {
    if (!s.activities.length) return;
    feed += '<div class="flex items-center gap-1.5 pb-0.5 pt-2 text-[9.5px] font-medium text-muted-foreground"><span class="font-mono">' + (i + 1) + '</span><span class="h-px w-2 bg-border"></span>' + esc(s.name) + '</div>';
    s.activities.forEach(function (a) {
      feed += '<div class="flex gap-2 rounded px-1 py-1 transition hover:bg-muted/50">' +
        '<span class="w-[44px] shrink-0 pt-[3px] font-mono text-[9px] tabular-nums text-muted-foreground/70">' + fmtTime(a.at) + '</span>' +
        '<span class="mt-[1px] shrink-0">' + activityIcon(a.k) + '</span>' +
        '<div class="min-w-0 flex-1">' +
          '<div class="text-[11.5px] leading-snug ' + (a.gate ? 'font-medium' : '') + '">' + esc(a.text) + '</div>' +
          (a.arg ? '<div class="mt-0.5 flex items-center gap-1.5 text-[9.5px] text-muted-foreground"><span class="rounded bg-muted px-1 py-[1px] font-mono">' + esc(toolName(run.harnessId, a.k)) + '</span><span class="truncate font-mono">' + esc(a.arg) + '</span></div>' : '') +
        '</div>' +
      '</div>';
    });
  });

  let now = '';
  if (waiting && cur) {
    now = '<div class="rounded-lg border border-amber-500/30 bg-amber-500/5 p-3.5">' +
      '<div class="flex items-center gap-2 text-[10.5px] font-medium text-amber-700 dark:text-amber-300">' + ic('Hand', 'h-3.5 w-3.5') + 'Waiting for approval</div>' +
      '<div class="mt-1.5 text-[13px] font-medium">' + esc(cur.name) + '</div>' +
      '<p class="mt-1 text-[11.5px] leading-relaxed text-muted-foreground">The next step will not start until you approve. The workflow is paused at gate ' + (run.currentStep + 1) + ' of ' + total + '.</p>' +
      '<div class="mt-3 hidden items-center gap-2 sm:flex">' +
        '<button class="btn btn-primary btn-sm" data-act="approve-gate">' + ic('Check', 'h-3.5 w-3.5') + 'Approve & continue</button>' +
        '<button class="btn btn-outline btn-sm" data-act="reject-gate">Reject</button>' +
      '</div>' +
    '</div>';
  } else if (run.status === 'completed') {
    now = '<div class="rounded-lg border border-emerald-500/25 bg-emerald-500/5 p-3.5">' +
      '<div class="flex items-center gap-2 text-[10.5px] font-medium text-emerald-700 dark:text-emerald-300">' + ic('CheckCircle2', 'h-3.5 w-3.5') + 'Run completed</div>' +
      '<div class="mt-1.5 text-[13px] font-medium">' + esc(run.workflowName) + '</div>' +
      '<p class="mt-1 text-[11.5px] leading-relaxed text-muted-foreground">All ' + total + ' steps finished in ' + fmtDur(elapsedMs(run)) + ' on ' + esc(harness.name) + '.</p>' +
    '</div>';
  } else if (run.status === 'stopped' || run.status === 'blocked') {
    now = '<div class="rounded-lg border bg-muted/30 p-3.5">' +
      '<div class="flex items-center gap-2 text-[10.5px] font-medium text-muted-foreground">' + ic('Square', 'h-3.5 w-3.5') + 'Run stopped</div>' +
      '<div class="mt-1.5 text-[13px] font-medium">' + esc(run.workflowName) + '</div>' +
      '<p class="mt-1 text-[11.5px] leading-relaxed text-muted-foreground">Stopped at step ' + Math.min(run.currentStep + 1, total) + ' of ' + total + ' after ' + fmtDur(elapsedMs(run)) + '. Start a new run to continue.</p>' +
    '</div>';
  } else if (cur) {
    const latest = latestActivity(cur);
    now = '<div class="rounded-lg border bg-muted/30 p-3.5">' +
      '<div class="flex items-center justify-between">' +
        '<span class="flex items-center gap-1.5 text-[10.5px] font-medium text-muted-foreground">' + ic(run.status === 'paused' ? 'Pause' : 'Activity', 'h-3.5 w-3.5') + (run.status === 'paused' ? 'Paused at' : 'Current step') + '</span>' +
        '<span class="font-mono text-[10px] text-muted-foreground">' + (run.currentStep + 1) + ' / ' + total + '</span>' +
      '</div>' +
      '<div class="mt-1.5 text-[13px] font-medium">' + esc(cur.name) + '</div>' +
      '<div class="mt-1 line-clamp-2 text-[11.5px] leading-relaxed text-muted-foreground">' + (latest ? esc(latest.text) : 'Preparing the step…') + '</div>' +
      (latest && latest.arg ? '<div class="mt-2 inline-flex max-w-full items-center gap-1.5 rounded border bg-background px-1.5 py-0.5 text-[10px] text-muted-foreground"><span class="font-mono">' + esc(toolName(run.harnessId, latest.k)) + '</span><span class="truncate font-mono">' + esc(latest.arg) + '</span></div>' : '') +
      '<div class="mt-2 flex items-center gap-1.5 text-[10px] text-muted-foreground">' +
        '<span class="h-1.5 w-1.5 rounded-full ' + (run.status === 'paused' ? 'bg-muted-foreground' : 'bg-blue-500 pulse-dot') + '"></span>' +
        (run.status === 'paused' ? 'Waiting for you to resume' : 'Streaming activity') +
      '</div>' +
    '</div>';
  }

  let footer = '';
  if (waiting) {
    footer = '<div class="flex items-center gap-2"><button class="btn btn-outline flex-1" data-act="reject-gate">' + ic('X', 'h-3.5 w-3.5') + 'Reject</button>' +
      '<button class="btn btn-primary flex-1" data-act="approve-gate">' + ic('Check', 'h-3.5 w-3.5') + 'Approve & continue</button></div>';
  } else if (run.status === 'running' || run.status === 'paused') {
    footer = '<div class="flex items-center gap-2">' +
      '<button class="btn btn-outline flex-1" data-act="' + (run.status === 'paused' ? 'resume-run' : 'pause-run') + '">' +
        ic(run.status === 'paused' ? 'Play' : 'Pause', 'h-3.5 w-3.5') + (run.status === 'paused' ? 'Resume' : 'Pause') + '</button>' +
      '<button class="btn btn-ghost flex-1 text-red-600 hover:text-red-700 dark:text-red-400" data-act="stop-run">' + ic('Square', 'h-3.5 w-3.5') + 'Stop</button>' +
    '</div>';
  } else {
    footer = '<div class="flex items-center gap-2"><button class="btn btn-outline flex-1" data-act="close-drawer">Close</button>' +
      '<button class="btn btn-primary flex-1" data-act="run-again" data-wf="' + run.workflowId + '">' + ic('RotateCcw', 'h-3.5 w-3.5') + 'Run again</button></div>';
  }

  root.innerHTML =
    '<div class="fixed inset-0 z-40 ' + (ui.drawerExpanded ? '' : 'bg-black/25 md:hidden') + '" data-act="close-drawer"></div>' +
    '<aside class="drawer-panel fixed right-0 top-0 z-40 flex h-full w-full ' + (ui.drawerExpanded ? '' : 'max-w-[500px]') + ' flex-col border-l bg-background shadow-2xl' + (ui.drawerAnimate ? ' animate-slide-in' : '') + '">' +
      '<div class="flex h-14 shrink-0 items-center justify-between gap-2 border-b px-4">' +
        '<div class="flex min-w-0 items-center gap-2.5">' +
          '<div class="grid h-8 w-8 shrink-0 place-items-center rounded-md border bg-muted/40 text-muted-foreground">' + ic('Workflow', 'h-4 w-4') + '</div>' +
          '<div class="min-w-0"><div class="truncate text-[12.5px] font-semibold">' + esc(run.workflowName) + '</div>' +
            '<div class="mt-0.5 flex items-center gap-1.5 text-[10px] text-muted-foreground"><span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>' +
              esc(harness.name) + '<span class="opacity-40">·</span>' + total + ' steps<span class="opacity-40">·</span>' + run.speed + '×</div></div>' +
        '</div>' +
        '<div class="flex shrink-0 items-center gap-0.5">' +
          (live ? '<button class="btn btn-ghost btn-icon-sm font-mono text-[10px]" data-act="run-speed" title="Simulation speed">' + run.speed + '×</button>' : '') +
          '<button class="btn btn-ghost btn-icon-sm" data-act="expand-drawer" title="' + (ui.drawerExpanded ? 'Restore' : 'Expand') + '">' + ic(ui.drawerExpanded ? 'Minimize2' : 'Maximize2', 'h-3.5 w-3.5') + '</button>' +
          '<button class="btn btn-ghost btn-icon-sm" data-act="close-drawer" title="Close">' + ic('X', 'h-4 w-4') + '</button>' +
        '</div>' +
      '</div>' +
      '<div class="shrink-0 border-b px-4 py-3">' +
        '<div class="flex items-center justify-between">' + statusBadge(run.status) +
          '<span class="font-mono text-[10.5px] tabular-nums text-muted-foreground" data-live-elapsed>' + fmtClock(elapsedMs(run)) + '</span></div>' +
        '<div class="mt-2.5 h-1.5 w-full overflow-hidden rounded-full bg-secondary">' +
          '<div class="h-full rounded-full transition-all duration-500 ' + (run.status === 'completed' ? 'bg-emerald-500' : waiting ? 'bg-amber-500' : 'bg-primary') + '" style="width:' + pct + '%"></div></div>' +
        '<div class="mt-1.5 flex items-center justify-between text-[10px] text-muted-foreground"><span>' + done + ' of ' + total + ' steps complete</span><span>' + gates + ' approval gate' + (gates === 1 ? '' : 's') + '</span></div>' +
      '</div>' +
      '<div id="runScroll" class="min-h-0 flex-1 overflow-y-auto">' +
        '<div class="space-y-5 p-4">' +
          now +
          '<div><div class="flex items-center justify-between"><h3 class="text-[10.5px] font-semibold text-muted-foreground">Steps</h3>' +
            '<span class="font-mono text-[9.5px] text-muted-foreground">' + done + '/' + total + '</span></div>' +
            '<div class="mt-2 overflow-hidden rounded-lg border bg-card"><div class="divide-y">' + stepRows + '</div></div></div>' +
          '<div><div class="flex items-center justify-between"><h3 class="text-[10.5px] font-semibold text-muted-foreground">Activity</h3>' +
            '<span class="flex items-center gap-1 text-[9.5px] text-muted-foreground"><span class="h-1 w-1 rounded-full bg-emerald-500"></span>' + run.steps.reduce(function (n, s) { return n + s.activities.length; }, 0) + ' events</span></div>' +
            '<div class="mt-1">' + (feed || '<p class="py-4 text-center text-[11px] text-muted-foreground">No activity yet.</p>') + '</div></div>' +
        '</div>' +
      '</div>' +
      '<div class="shrink-0 border-t bg-muted/20 px-4 py-3">' +
        footer +
        '<p class="mt-2 text-center text-[9.5px] text-muted-foreground">Simulated execution · no CLI process is launched in this demo</p>' +
      '</div>' +
    '</aside>';

  const sc = $('#runScroll');
  if (sc) {
    if (!live || (waiting && ui.lastStatus !== 'waiting')) {
      requestAnimationFrame(function () { sc.scrollTop = 0; });
    } else if (ui.autoScroll) {
      requestAnimationFrame(function () { sc.scrollTop = sc.scrollHeight; });
    }
    sc.addEventListener('scroll', function () {
      ui.autoScroll = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 48;
    });
  }
  ui.lastStatus = run.status;
  ui.drawerAnimate = false;
  syncToastPosition();
  refreshIcons();
}

/* ------------------------------- dialogs ----------------------------- */

function openDialog(opts) {
  const sizes = { sm: 'max-w-[430px]', md: 'max-w-[540px]', lg: 'max-w-[700px]' };
  const size = sizes[opts.size || 'md'];
  $('#dialogRoot').innerHTML =
    '<div class="fixed inset-0 z-50 flex items-center justify-center p-4">' +
      '<div class="absolute inset-0 bg-black/55 backdrop-blur-[2px]" data-act="close-dialog"></div>' +
      '<div role="dialog" aria-modal="true" class="relative flex max-h-[88vh] w-full ' + size + ' flex-col rounded-xl border bg-background shadow-2xl animate-pop">' +
        '<div class="flex shrink-0 items-start justify-between gap-4 px-5 pb-3 pt-5">' +
          '<div class="min-w-0"><h2 class="text-[15px] font-semibold tracking-[-0.01em]">' + esc(opts.title) + '</h2>' +
            (opts.description ? '<p class="mt-1 text-[11.5px] leading-relaxed text-muted-foreground">' + opts.description + '</p>' : '') + '</div>' +
          '<button class="btn btn-ghost btn-icon-sm -mr-1 -mt-0.5 shrink-0" data-act="close-dialog" aria-label="Close dialog">' + ic('X', 'h-4 w-4') + '</button>' +
        '</div>' +
        '<div class="min-h-0 flex-1 overflow-y-auto px-5 pb-4">' + opts.body + '</div>' +
        (opts.footer ? '<div class="flex shrink-0 items-center justify-end gap-2 border-t bg-muted/20 px-5 py-3">' + opts.footer + '</div>' : '') +
      '</div>' +
    '</div>';
  refreshIcons();
  setTimeout(function () {
    const el = $('#dialogRoot [data-autofocus]') || $('#dialogRoot input') || $('#dialogRoot textarea');
    if (el) el.focus();
    if (typeof opts.onMount === 'function') opts.onMount();
  }, 30);
}

function closeDialog() {
  $('#dialogRoot').innerHTML = '';
  confirmHandler = null;
}

function confirmDialog(opts) {
  confirmHandler = opts.onConfirm || null;
  openDialog({
    title: opts.title,
    size: 'sm',
    body: '<div class="rounded-lg border bg-muted/30 p-3 text-[12px] leading-relaxed text-muted-foreground">' + opts.body + '</div>' +
      (opts.warning ? '<p class="mt-3 flex items-start gap-2 text-[11px] leading-relaxed text-red-600 dark:text-red-400">' + ic('TriangleAlert', 'h-3.5 w-3.5 mt-0.5 shrink-0') + opts.warning + '</p>' : ''),
    footer: '<button class="btn btn-outline" data-act="close-dialog">Cancel</button>' +
      '<button class="btn btn-danger" data-act="confirm-action">' + esc(opts.confirmLabel || 'Delete') + '</button>'
  });
}

/* -------------------------------- menus ------------------------------ */

function closeMenu() {
  currentMenu = [];
  $('#menuRoot').innerHTML = '';
}

function openMenu(anchor, items) {
  closeMenu();
  currentMenu = items;
  const root = $('#menuRoot');
  root.innerHTML = '<div id="menuPanel" class="fixed z-[70] min-w-[205px] rounded-md border bg-popover p-1 text-popover-foreground shadow-lg animate-pop">' +
    items.map(function (item, i) {
      if (item.sep) return '<div class="my-1 h-px bg-border"></div>';
      return '<button data-mi="' + i + '" class="flex w-full items-center gap-2 rounded-sm px-2 py-1.5 text-left text-[12px] transition ' +
        (item.danger ? 'text-red-600 hover:bg-red-500/10 dark:text-red-400' : 'hover:bg-accent') + ' ' + (item.disabled ? 'pointer-events-none opacity-40' : '') + '">' +
        ic(item.icon || 'Circle', 'h-3.5 w-3.5 opacity-70') +
        '<span class="flex-1">' + esc(item.label) + '</span>' +
        (item.checked ? ic('Check', 'h-3.5 w-3.5') : '') +
        (item.hint ? '<span class="font-mono text-[9.5px] text-muted-foreground">' + esc(item.hint) + '</span>' : '') +
      '</button>';
    }).join('') + '</div>';
  const panel = $('#menuPanel');
  const rect = anchor.getBoundingClientRect();
  const w = panel.offsetWidth;
  const h = panel.offsetHeight;
  let left = Math.min(rect.right - w, window.innerWidth - w - 8);
  left = Math.max(8, left);
  let top = rect.bottom + 6;
  if (top + h > window.innerHeight - 8) top = Math.max(8, rect.top - h - 6);
  panel.style.left = left + 'px';
  panel.style.top = top + 'px';
  refreshIcons();
}

function openWorkflowMenu(wfId, anchor) {
  const wf = workflowById(wfId);
  if (!wf) return;
  const idx = state.workflows.findIndex(function (w) { return w.id === wfId; });
  openMenu(anchor, [
    { label: 'Rename', icon: 'Pencil', action: function () { beginRename(wfId); } },
    { label: 'Edit details', icon: 'Settings2', action: function () { openWorkflowDialog(wf); } },
    { label: 'Duplicate', icon: 'Copy', action: function () { duplicateWorkflow(wfId); } },
    { sep: true },
    { label: 'Run workflow', icon: 'Play', action: function () { openLaunchDialog(wfId); } },
    { sep: true },
    { label: 'Move up', icon: 'ArrowUp', disabled: idx <= 0, action: function () { moveWorkflow(wfId, -1); } },
    { label: 'Move down', icon: 'ArrowDown', disabled: idx >= state.workflows.length - 1, action: function () { moveWorkflow(wfId, 1); } },
    { sep: true },
    { label: 'Delete workflow', icon: 'Trash2', danger: true, action: function () { confirmDeleteWorkflow(wfId); } }
  ]);
}

function openStepMenu(wfId, stepId, anchor) {
  const wf = workflowById(wfId);
  if (!wf) return;
  const idx = wf.steps.findIndex(function (s) { return s.id === stepId; });
  const st = wf.steps[idx];
  if (!st) return;
  openMenu(anchor, [
    { label: 'Step settings', icon: 'Settings2', action: function () { openStepDialog(wfId, stepId); } },
    { label: st.gate ? 'Remove approval gate' : 'Require approval', icon: 'Hand', action: function () { toggleGate(wfId, stepId); } },
    { sep: true },
    { label: 'Move up', icon: 'ArrowUp', disabled: idx <= 0, action: function () { moveStep(wfId, stepId, -1); } },
    { label: 'Move down', icon: 'ArrowDown', disabled: idx >= wf.steps.length - 1, action: function () { moveStep(wfId, stepId, 1); } },
    { sep: true },
    { label: 'Remove from workflow', icon: 'Trash2', danger: true, action: function () { confirmRemoveStep(wfId, stepId); } }
  ]);
}

function openSkillMenu(skillId, anchor) {
  const skill = skillById(skillId);
  if (!skill) return;
  openMenu(anchor, [
    { label: 'Edit skill', icon: 'Pencil', action: function () { openSkillDialog(skill); } },
    { label: 'Duplicate', icon: 'Copy', action: function () { duplicateSkill(skillId); } },
    { sep: true },
    { label: 'Delete skill', icon: 'Trash2', danger: true, action: function () { confirmDeleteSkill(skillId); } }
  ]);
}

/* ---------------------------- workflow CRUD -------------------------- */

function beginRename(wfId) {
  ui.renaming = wfId;
  renderMain();
  setTimeout(function () {
    const input = $('#wfNameInput');
    if (input) { input.focus(); input.select(); }
  }, 20);
}

function bindRename() {
  if (!ui.renaming) return;
  const input = $('#wfNameInput');
  if (!input) return;
  const commit = function () {
    const id = ui.renaming;
    if (!id) return;
    const wf = workflowById(id);
    const value = input.value.trim();
    ui.renaming = null;
    if (wf && value && value !== wf.name) {
      wf.name = value;
      wf.updatedAt = Date.now();
      save();
      render();
      toast('Workflow renamed', value);
    } else {
      renderMain();
      refreshIcons();
    }
  };
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    else if (e.key === 'Escape') { e.preventDefault(); ui.renaming = null; renderMain(); refreshIcons(); }
  });
  input.addEventListener('blur', commit);
}

function openWorkflowDialog(wf) {
  const editing = !!wf;
  const templateOptions = state.workflows.map(function (w) {
    return '<option value="' + w.id + '">Copy of ' + esc(w.name) + ' (' + w.steps.length + ' steps)</option>';
  }).join('');
  openDialog({
    title: editing ? 'Workflow details' : 'New workflow',
    description: editing ? 'Rename the workflow or refine what it is for.' : 'Start blank or copy an existing workflow as a template.',
    size: 'md',
    body: '<form id="workflowForm" class="space-y-4">' +
      '<input type="hidden" name="wfId" value="' + (editing ? wf.id : '') + '" />' +
      '<div><label class="label" for="wfFormName">Name</label>' +
        '<input id="wfFormName" name="name" class="input" value="' + esc(editing ? wf.name : '') + '" placeholder="e.g. Release a patch" data-autofocus maxlength="70" /></div>' +
      '<div><label class="label" for="wfFormDesc">Description</label>' +
        '<textarea id="wfFormDesc" name="description" rows="3" class="input" placeholder="What this workflow accomplishes.">' + esc(editing ? wf.description : '') + '</textarea></div>' +
      (!editing ? '<div><label class="label" for="wfFormTemplate">Start from</label>' +
        '<select id="wfFormTemplate" name="template" class="input"><option value="blank">Blank workflow</option>' + templateOptions + '</select>' +
        '<p class="hint">Copied steps get fresh IDs and can be edited independently.</p></div>' : '') +
      '</form>',
    footer: '<button class="btn btn-outline" data-act="close-dialog">Cancel</button>' +
      '<button class="btn btn-primary" type="submit" form="workflowForm">' + (editing ? 'Save changes' : 'Create workflow') + '</button>'
  });
}

function saveWorkflowForm(form) {
  const data = new FormData(form);
  const id = String(data.get('wfId') || '');
  const name = String(data.get('name') || '').trim();
  const description = String(data.get('description') || '').trim();
  if (!name) { toast('Name required', 'Give the workflow a short name.', 'destructive'); return; }
  if (id) {
    const wf = workflowById(id);
    if (!wf) return;
    wf.name = name;
    wf.description = description;
    wf.updatedAt = Date.now();
    closeDialog();
    save(); render();
    toast('Workflow updated', name);
    return;
  }
  let steps = [];
  const templateId = String(data.get('template') || 'blank');
  if (templateId && templateId !== 'blank') {
    const source = workflowById(templateId);
    if (source) {
      steps = source.steps.map(function (s) {
        return { id: uid('step'), skillId: s.skillId, gate: !!s.gate, instructions: s.instructions || '' };
      });
    }
  }
  const wf = { id: uid('wf'), name: name, description: description, steps: steps, updatedAt: Date.now() };
  state.workflows.unshift(wf);
  state.activeWorkflowId = wf.id;
  state.view = 'workflows';
  closeDialog();
  save(); render();
  toast('Workflow created', name + (steps.length ? ' · ' + steps.length + ' steps' : ''));
}

function duplicateWorkflow(wfId) {
  const wf = workflowById(wfId);
  if (!wf) return;
  const copy = {
    id: uid('wf'),
    name: wf.name + ' copy',
    description: wf.description,
    steps: wf.steps.map(function (s) {
      return { id: uid('step'), skillId: s.skillId, gate: !!s.gate, instructions: s.instructions || '' };
    }),
    updatedAt: Date.now()
  };
  const idx = state.workflows.findIndex(function (w) { return w.id === wfId; });
  state.workflows.splice(idx + 1, 0, copy);
  state.activeWorkflowId = copy.id;
  save(); render();
  toast('Workflow duplicated', copy.name);
}

function moveWorkflow(wfId, dir) {
  const idx = state.workflows.findIndex(function (w) { return w.id === wfId; });
  const next = idx + dir;
  if (idx < 0 || next < 0 || next >= state.workflows.length) return;
  const item = state.workflows.splice(idx, 1)[0];
  state.workflows.splice(next, 0, item);
  save(); render();
}

function confirmDeleteWorkflow(wfId) {
  const wf = workflowById(wfId);
  if (!wf) return;
  const runCount = state.runs.filter(function (r) { return r.workflowId === wfId; }).length;
  confirmDialog({
    title: 'Delete "' + wf.name + '"?',
    body: 'The workflow and its ' + wf.steps.length + ' step' + (wf.steps.length === 1 ? '' : 's') + ' will be removed.' +
      (runCount ? ' ' + runCount + ' historical run' + (runCount === 1 ? '' : 's') + ' will stay in Runs.' : ''),
    confirmLabel: 'Delete workflow',
    onConfirm: function () {
      state.workflows = state.workflows.filter(function (w) { return w.id !== wfId; });
      if (state.activeWorkflowId === wfId) state.activeWorkflowId = state.workflows[0] ? state.workflows[0].id : null;
      save(); render();
      toast('Workflow deleted', wf.name);
    }
  });
}

/* ------------------------------ step CRUD ---------------------------- */

function openStepDialog(wfId, stepId) {
  const wf = workflowById(wfId);
  const st = wf && wf.steps.find(function (s) { return s.id === stepId; });
  if (!wf || !st) return;
  const skill = skillById(st.skillId);
  const defaultText = skill ? skill.instructions : '';
  openDialog({
    title: 'Step settings',
    description: esc(skill ? skill.name : 'Missing skill') + ' · position ' + (wf.steps.findIndex(function (s) { return s.id === stepId; }) + 1),
    size: 'lg',
    body: '<form id="stepForm" class="space-y-4">' +
      '<input type="hidden" name="wfId" value="' + wf.id + '" /><input type="hidden" name="stepId" value="' + st.id + '" />' +
      '<div class="rounded-lg border bg-muted/25 p-3">' +
        '<div class="flex items-start gap-2"><span class="mt-0.5 text-muted-foreground">' + ic(skill ? skill.icon : 'CircleHelp', 'h-4 w-4') + '</span>' +
        '<p class="text-[11.5px] leading-relaxed text-muted-foreground">' + esc(skill ? skill.description : 'This skill no longer exists in the library.') + '</p></div>' +
      '</div>' +
      '<div><label class="label" for="stepInstructions">Instruction override</label>' +
        '<textarea id="stepInstructions" name="instructions" rows="6" class="input font-mono text-[11.5px]" placeholder="Leave blank to use the skill default.">' + esc(st.instructions || '') + '</textarea>' +
        '<p class="hint">Overrides apply only to this step. The shared skill stays unchanged.</p></div>' +
      '<div class="rounded-lg border p-3">' +
        '<label class="flex cursor-pointer items-start gap-2.5">' +
          '<input type="checkbox" name="gate" class="mt-0.5 h-4 w-4 rounded border-input accent-foreground" ' + (st.gate ? 'checked' : '') + ' />' +
          '<span><span class="block text-[12px] font-medium">Require approval after this step</span>' +
          '<span class="mt-0.5 block text-[11px] leading-relaxed text-muted-foreground">The run pauses at a gate until you approve or reject continuing.</span></span>' +
        '</label>' +
      '</div>' +
      (st.instructions ? '<button type="button" class="btn btn-ghost btn-sm" data-act="clear-override">' + ic('RotateCcw', 'h-3.5 w-3.5') + 'Clear override</button>' : '') +
      '<details class="rounded-md border p-3"><summary class="cursor-pointer text-[11px] font-medium text-muted-foreground">Default instructions</summary>' +
        '<p class="mt-2 whitespace-pre-wrap text-[11px] leading-relaxed text-muted-foreground">' + esc(defaultText) + '</p></details>' +
      '</form>',
    footer: '<button class="btn btn-outline" data-act="close-dialog">Cancel</button>' +
      '<button class="btn btn-primary" type="submit" form="stepForm">Save step</button>'
  });
}

function saveStepForm(form) {
  const data = new FormData(form);
  const wf = workflowById(String(data.get('wfId')));
  const st = wf && wf.steps.find(function (s) { return s.id === String(data.get('stepId')); });
  if (!wf || !st) return;
  st.instructions = String(data.get('instructions') || '').trim();
  st.gate = !!data.get('gate');
  wf.updatedAt = Date.now();
  closeDialog();
  save(); render();
  toast('Step updated');
}

function toggleGate(wfId, stepId) {
  const wf = workflowById(wfId);
  const st = wf && wf.steps.find(function (s) { return s.id === stepId; });
  if (!wf || !st) return;
  st.gate = !st.gate;
  wf.updatedAt = Date.now();
  save(); render();
  toast(st.gate ? 'Approval gate added' : 'Approval gate removed', st.gate ? 'The run will pause after this step.' : 'The run will continue automatically.');
}

function moveStep(wfId, stepId, dir) {
  const wf = workflowById(wfId);
  if (!wf) return;
  const idx = wf.steps.findIndex(function (s) { return s.id === stepId; });
  const next = idx + dir;
  if (idx < 0 || next < 0 || next >= wf.steps.length) return;
  const item = wf.steps.splice(idx, 1)[0];
  wf.steps.splice(next, 0, item);
  wf.updatedAt = Date.now();
  save(); render();
}

function confirmRemoveStep(wfId, stepId) {
  const wf = workflowById(wfId);
  const st = wf && wf.steps.find(function (s) { return s.id === stepId; });
  if (!wf || !st) return;
  const skill = skillById(st.skillId);
  confirmDialog({
    title: 'Remove step?',
    body: '"' + esc(skill ? skill.name : 'Unknown skill') + '" will be removed from "' + esc(wf.name) + '". The skill stays in the library.',
    confirmLabel: 'Remove step',
    onConfirm: function () {
      wf.steps = wf.steps.filter(function (s) { return s.id !== stepId; });
      wf.updatedAt = Date.now();
      save(); render();
      toast('Step removed');
    }
  });
}

/* ----------------------------- skill CRUD ---------------------------- */

function openSkillDialog(skill) {
  const editing = !!skill;
  const cats = Object.keys(CATEGORIES).map(function (key) {
    return '<option value="' + key + '" ' + (editing && skill.category === key ? 'selected' : '') + '>' + CATEGORIES[key].label + '</option>';
  }).join('');
  openDialog({
    title: editing ? 'Edit skill' : 'New skill',
    description: editing ? 'Changes ripple through every workflow that references this skill.' : 'Create a reusable instruction block for the workflow library.',
    size: 'lg',
    body: '<form id="skillForm" class="space-y-4">' +
      '<input type="hidden" name="skillId" value="' + (editing ? skill.id : '') + '" />' +
      '<div class="grid gap-4 sm:grid-cols-[1fr_180px]">' +
        '<div><label class="label" for="skillName">Name</label><input id="skillName" name="name" class="input" value="' + esc(editing ? skill.name : '') + '" placeholder="e.g. Accessibility audit" data-autofocus maxlength="60" /></div>' +
        '<div><label class="label" for="skillCategory">Category</label><select id="skillCategory" name="category" class="input">' + cats + '</select></div>' +
      '</div>' +
      '<div><label class="label" for="skillDesc">Description</label><textarea id="skillDesc" name="description" rows="2" class="input" placeholder="One sentence on what this skill does.">' + esc(editing ? skill.description : '') + '</textarea></div>' +
      '<div><label class="label" for="skillInstructions">Instructions</label>' +
        '<textarea id="skillInstructions" name="instructions" rows="7" class="input font-mono text-[11.5px]" placeholder="Tell the agent exactly how to perform this step.">' + esc(editing ? skill.instructions : '') + '</textarea>' +
        '<p class="hint">Plain text. One instruction per line works best.</p></div>' +
      (editing ? '<p class="text-[10.5px] text-muted-foreground">Used in ' + state.workflows.filter(function (w) { return w.steps.some(function (s) { return s.skillId === skill.id; }); }).length + ' workflow(s).</p>' : '') +
      '</form>',
    footer: '<button class="btn btn-outline" data-act="close-dialog">Cancel</button>' +
      '<button class="btn btn-primary" type="submit" form="skillForm">' + (editing ? 'Save skill' : 'Create skill') + '</button>'
  });
}

function saveSkillForm(form) {
  const data = new FormData(form);
  const id = String(data.get('skillId') || '');
  const name = String(data.get('name') || '').trim();
  const description = String(data.get('description') || '').trim();
  const instructions = String(data.get('instructions') || '').trim();
  const category = String(data.get('category') || 'discovery');
  if (!name) { toast('Name required', 'Give the skill a short name.', 'destructive'); return; }
  if (id) {
    const skill = skillById(id);
    if (!skill) return;
    skill.name = name; skill.description = description; skill.instructions = instructions; skill.category = category;
    if (!skill.icon) skill.icon = 'Sparkles';
    closeDialog(); save(); render();
    toast('Skill updated', name);
    return;
  }
  state.skills.push({ id: uid('sk'), name: name, description: description, instructions: instructions, category: category, icon: 'Sparkles' });
  closeDialog(); save(); render();
  toast('Skill created', name);
}

function duplicateSkill(skillId) {
  const skill = skillById(skillId);
  if (!skill) return;
  state.skills.push(Object.assign({}, skill, { id: uid('sk'), name: skill.name + ' copy' }));
  save(); render();
  toast('Skill duplicated', skill.name + ' copy');
}

function confirmDeleteSkill(skillId) {
  const skill = skillById(skillId);
  if (!skill) return;
  const used = state.workflows.filter(function (w) { return w.steps.some(function (s) { return s.skillId === skillId; }); });
  confirmDialog({
    title: 'Delete "' + skill.name + '"?',
    body: used.length
      ? '<p>This skill is used in ' + used.length + ' workflow' + (used.length === 1 ? '' : 's') + ':</p><ul class="mt-2 space-y-1">' +
        used.map(function (w) { return '<li class="flex items-center gap-1.5 text-foreground">' + ic('Workflow', 'h-3 w-3') + esc(w.name) + '</li>'; }).join('') +
        '</ul><p class="mt-2">Those steps will be removed too. Historical runs keep their snapshot.</p>'
      : '<p>This skill is not used by any workflow.</p>',
    confirmLabel: 'Delete skill',
    warning: used.length ? 'This removes the skill from ' + used.length + ' workflow' + (used.length === 1 ? '' : 's') + '.' : '',
    onConfirm: function () {
      state.skills = state.skills.filter(function (s) { return s.id !== skillId; });
      state.workflows.forEach(function (w) { w.steps = w.steps.filter(function (s) { return s.skillId !== skillId; }); });
      save(); render();
      toast('Skill deleted', skill.name);
    }
  });
}

/* ---------------------------- add-skill dialog ----------------------- */

function openAddSkillDialog(wfId) {
  const wf = workflowById(wfId);
  if (!wf) return;
  ui.addWfId = wfId;
  ui.addSkillQuery = '';
  ui.addSkillCat = 'all';
  openDialog({
    title: 'Add a skill',
    description: 'Choose a library skill to append to <span class="font-medium text-foreground">' + esc(wf.name) + '</span>.',
    size: 'lg',
    body: '<div class="space-y-3">' +
      '<div class="relative"><span class="pointer-events-none absolute left-2.5 top-1/2 -translate-y-1/2 text-muted-foreground/70">' + ic('Search', 'h-3.5 w-3.5') + '</span>' +
        '<input id="addSkillSearch" class="input h-9 pl-8 text-[12px]" placeholder="Search the library" value="" data-autofocus /></div>' +
      '<div id="addSkillCats" class="flex flex-wrap gap-1"></div>' +
      '<div id="addSkillList" class="max-h-[340px] space-y-0.5 overflow-y-auto pr-1"></div>' +
    '</div>',
    footer: '<span id="addSkillCount" class="mr-auto text-[10.5px] text-muted-foreground"></span>' +
      '<button class="btn btn-outline" data-act="close-dialog">Done</button>' +
      '<button class="btn btn-ghost btn-sm" data-act="new-skill">' + ic('Plus', 'h-3.5 w-3.5') + 'New skill</button>'
  });
  renderAddSkillCats();
  renderAddSkillList();
}

function renderAddSkillCats() {
  const wrap = $('#addSkillCats');
  if (!wrap) return;
  const all = [['all', 'All']].concat(Object.keys(CATEGORIES).map(function (k) { return [k, CATEGORIES[k].label]; }));
  wrap.innerHTML = all.map(function (pair) {
    const active = ui.addSkillCat === pair[0];
    return '<button class="badge ' + (active ? 'border-primary bg-primary text-primary-foreground' : 'bg-background text-muted-foreground hover:bg-accent') + '" data-act="add-skill-cat" data-cat="' + pair[0] + '">' + pair[1] + '</button>';
  }).join('');
  refreshIcons();
}

function renderAddSkillList() {
  const list = $('#addSkillList');
  if (!list) return;
  const wf = workflowById(ui.addWfId);
  if (!wf) return;
  const used = new Set(wf.steps.map(function (s) { return s.skillId; }));
  const q = ui.addSkillQuery.trim().toLowerCase();
  const skills = state.skills.filter(function (s) {
    const catOk = ui.addSkillCat === 'all' || s.category === ui.addSkillCat;
    const qOk = !q || s.name.toLowerCase().indexOf(q) >= 0 || s.description.toLowerCase().indexOf(q) >= 0;
    return catOk && qOk;
  }).sort(function (a, b) {
    if (a.category !== b.category) return a.category.localeCompare(b.category);
    return a.name.localeCompare(b.name);
  });
  if (!skills.length) {
    list.innerHTML = '<div class="rounded-lg border border-dashed py-8 text-center text-[11.5px] text-muted-foreground">No matching skills.</div>';
  } else {
    list.innerHTML = skills.map(function (s) {
      return '<div class="flex items-start gap-2.5 rounded-md border border-transparent px-2 py-2 transition hover:bg-accent/50">' +
        '<span class="mt-0.5 grid h-7 w-7 shrink-0 place-items-center rounded-md border bg-muted/30 text-muted-foreground">' + ic(s.icon, 'h-3.5 w-3.5') + '</span>' +
        '<div class="min-w-0 flex-1"><div class="flex items-center gap-1.5"><span class="text-[12px] font-medium">' + esc(s.name) + '</span>' +
          '<span class="text-[9.5px] text-muted-foreground">' + (CATEGORIES[s.category] || { label: '' }).label + '</span></div>' +
          '<div class="mt-0.5 line-clamp-2 text-[10.5px] leading-relaxed text-muted-foreground">' + esc(s.description) + '</div></div>' +
        (used.has(s.id)
          ? '<span class="badge badge-muted mt-0.5 shrink-0">' + ic('Check', 'h-2.5 w-2.5') + 'Added</span>'
          : '<button class="btn btn-outline btn-sm mt-0.5 shrink-0" data-act="pick-skill" data-skill="' + s.id + '">' + ic('Plus', 'h-3 w-3') + 'Add</button>') +
      '</div>';
    }).join('');
  }
  const count = $('#addSkillCount');
  if (count) count.textContent = used.size + ' of ' + state.skills.length + ' skills in this workflow';
  refreshIcons();
}

function pickSkill(skillId) {
  const wf = workflowById(ui.addWfId);
  const skill = skillById(skillId);
  if (!wf || !skill) return;
  if (wf.steps.some(function (s) { return s.skillId === skillId; })) return;
  const st = { id: uid('step'), skillId: skillId, gate: false, instructions: '' };
  wf.steps.push(st);
  wf.updatedAt = Date.now();
  save(); render();
  renderAddSkillList();
  toast('Skill added', skill.name + ' → ' + wf.name);
}

/* ------------------------------ launch ------------------------------- */

function openLaunchDialog(wfId) {
  const wf = workflowById(wfId);
  if (!wf) return;
  if (!wf.steps.length) {
    toast('Add a step first', 'A workflow needs at least one skill to run.', 'destructive');
    return;
  }
  ui.launchWfId = wf.id;
  ui.launchHarness = state.defaultHarness;
  openDialog({
    title: 'Run workflow',
    description: 'Choose a harness, inspect the launch command, then start.',
    size: 'lg',
    body: '<div id="launchBody">' + launchBody(wf) + '</div>',
    footer: '<button class="btn btn-outline" data-act="close-dialog">Cancel</button>' +
      '<button class="btn btn-outline" data-act="copy-command">' + ic('Copy', 'h-3.5 w-3.5') + 'Copy command</button>' +
      '<button class="btn btn-primary" data-act="start-run">' + ic('Play', 'h-3.5 w-3.5 fill-current') + 'Start run</button>'
  });
}

function launchBody(wf) {
  const gates = wf.steps.filter(function (s) { return s.gate; }).length;
  const est = Math.max(2, Math.round(wf.steps.length * 2.2));
  return '<div class="space-y-5">' +
    '<div class="flex items-center gap-3 rounded-lg border bg-muted/25 p-3">' +
      '<div class="grid h-9 w-9 shrink-0 place-items-center rounded-md border bg-background text-muted-foreground">' + ic('Workflow', 'h-4 w-4') + '</div>' +
      '<div class="min-w-0 flex-1"><div class="truncate text-[12.5px] font-medium">' + esc(wf.name) + '</div>' +
        '<div class="mt-0.5 text-[10.5px] text-muted-foreground">' + wf.steps.length + ' steps · ' + gates + ' gate' + (gates === 1 ? '' : 's') + ' · ~' + est + ' min</div></div>' +
      '<span class="badge badge-muted">' + wf.steps.length + ' skills</span>' +
    '</div>' +
    '<div><div class="label">Harness</div><div class="grid gap-2 sm:grid-cols-2">' +
      HARNESSES.map(function (h) {
        return '<button type="button" class="harness-option" data-act="pick-launch-harness" data-harness="' + h.id + '" aria-pressed="' + (h.id === ui.launchHarness) + '">' +

/* ----------------------------- run engine ---------------------------- */

function openRun(runId) {
  const run = runById(runId);
  if (!run) return;
  ui.activeRunId = run.id;
  ui.drawerOpen = true;
  ui.drawerExpanded = false;
  ui.drawerAnimate = true;
  ui.autoScroll = isLive(run);
  ui.lastStatus = null;
  render();
}

function startRun(wfId, harnessId) {
  const wf = workflowById(wfId);
  if (!wf) return;
  if (!wf.steps.length) {
    toast('Nothing to run', 'Add at least one skill to this workflow.', 'destructive');
    return;
  }
  const live = liveRun();
  if (live) {
    closeDialog();
    openRun(live.id);
    toast('A run is already in progress', 'Finish or stop it before starting another.', 'destructive');
    return;
  }
  closeDialog();
  const now = Date.now();
  const run = {
    id: uid('run'),
    workflowId: wf.id,
    workflowName: wf.name,
    harnessId: harnessId || state.defaultHarness,
    status: 'running',
    startedAt: now,
    endedAt: null,
    pausedMs: 0,
    pausedAt: null,
    currentStep: 0,
    speed: state.simSpeed || 1,
    steps: wf.steps.map(function (s) {
      const skill = skillById(s.skillId);
      return {
        id: uid('rst'),
        stepId: s.id,
        skillId: s.skillId,
        name: skill ? skill.name : 'Unknown skill',
        gate: !!s.gate,
        instructions: s.instructions || '',
        status: 'pending',
        activities: [],
        startedAt: null,
        endedAt: null
      };
    })
  };
  state.runs.unshift(run);
  state.runs = state.runs.slice(0, 40);
  ui.activeRunId = run.id;
  ui.drawerOpen = true;
  ui.drawerExpanded = false;
  ui.drawerAnimate = true;
  ui.autoScroll = true;
  ui.lastStatus = null;
  save();
  render();
  scheduleTick(350);
  toast('Run started', wf.name + ' on ' + harnessById(run.harnessId).name);
}

function scheduleTick(delay) {
  clearTimeout(runTimer);
  const run = activeRun();
  if (!run || run.status !== 'running') return;
  const speed = run.speed || 1;
  const wait = typeof delay === 'number' ? delay : (680 + Math.random() * 420) / speed;
  runTimer = setTimeout(tick, Math.max(120, wait));
}

function tick() {
  const run = activeRun();
  if (!run || run.status !== 'running') return;
  let step = run.steps[run.currentStep];
  if (!step) { completeRun(run); return; }
  if (step.status === 'pending') {
    step.status = 'running';
    step.startedAt = Date.now();
  }
  const plan = planFor(step.skillId);
  if (step.activities.length < plan.length) {
    const item = plan[step.activities.length];
    step.activities.push(Object.assign({}, item, { at: Date.now() }));
    save();
    if (ui.drawerOpen && ui.activeRunId === run.id) renderDrawer();
    scheduleTick();
    return;
  }
  finishStep(run, step);
}

function finishStep(run, step) {
  step.endedAt = Date.now();
  if (step.gate) {
    step.status = 'waiting';
    step.activities.push({ k: 'gate', gate: true, text: 'Approval required to continue', at: Date.now() });
    run.status = 'waiting';
    save();
    render();
    toast('Approval needed', step.name + ' is waiting for you.', 'default');
    return;
  }
  step.status = 'done';
  step.activities.push({ k: 'done', text: 'Step complete', at: Date.now() });
  run.currentStep += 1;
  if (run.currentStep >= run.steps.length) { completeRun(run); return; }
  save();
  render();
  scheduleTick();
}

function completeRun(run) {
  run.status = 'completed';
  run.endedAt = Date.now();
  run.currentStep = run.steps.length;
  save();
  render();
  toast('Run completed', run.workflowName + ' finished in ' + fmtDur(elapsedMs(run)) + '.', 'success');
}

function pauseRun() {
  const run = activeRun();
  if (!run || run.status !== 'running') return;
  clearTimeout(runTimer);
  run.status = 'paused';
  run.pausedAt = Date.now();
  save(); render();
  toast('Run paused', 'Resume from the run drawer.');
}

function resumeRun() {
  const run = activeRun();
  if (!run || run.status !== 'paused') return;
  if (run.pausedAt) run.pausedMs = (run.pausedMs || 0) + (Date.now() - run.pausedAt);
  run.pausedAt = null;
  run.status = 'running';
  save(); render();
  scheduleTick(200);
}

function stopRunNow() {
  const run = activeRun();
  if (!run || !isLive(run)) return;
  clearTimeout(runTimer);
  const step = run.steps[run.currentStep];
  if (step && ['running', 'waiting', 'pending'].indexOf(step.status) >= 0) {
    step.status = 'stopped';
    step.endedAt = Date.now();
    step.activities.push({ k: 'stop', text: 'Stopped by you', at: Date.now() });
  }
  run.status = 'stopped';
  run.endedAt = Date.now();
  run.pausedAt = null;
  ui.autoScroll = false;
  save(); render();
  toast('Run stopped', run.workflowName + ' did not finish.', 'destructive');
}

function approveGate() {
  const run = activeRun();
  if (!run || run.status !== 'waiting') return;
  const step = run.steps[run.currentStep];
  if (!step) return;
  step.status = 'done';
  step.endedAt = Date.now();
  step.activities.push({ k: 'gate-ok', gate: true, text: 'Approved by you — continuing', at: Date.now() });
  run.status = 'running';
  run.currentStep += 1;
  ui.autoScroll = true;
  if (run.currentStep >= run.steps.length) { save(); completeRun(run); return; }
  save(); render();
  scheduleTick(250);
  toast('Approved', 'Continuing to ' + run.steps[run.currentStep].name + '.');
}

function rejectGate() {
  const run = activeRun();
  if (!run || run.status !== 'waiting') return;
  const step = run.steps[run.currentStep];
  if (step) {
    step.status = 'blocked';
    step.endedAt = Date.now();
    step.activities.push({ k: 'gate-no', gate: true, text: 'Rejected by you — run stopped', at: Date.now() });
  }
  run.status = 'stopped';
  run.endedAt = Date.now();
  ui.autoScroll = false;
  save(); render();
  toast('Run rejected', 'The run stopped at the gate.', 'destructive');
}

function cycleRunSpeed() {
  const run = activeRun();
  if (!run || !isLive(run)) return;
  run.speed = run.speed === 1 ? 2 : run.speed === 2 ? 4 : 1;
  save();
  renderDrawer();
  scheduleTick(150);
}

/* ------------------------------- drag -------------------------------- */

function bindDrags() {
  bindDrag($('#wfList'), 'workflow');
  bindDrag($('#stepList'), 'step');
}

function bindDrag(container, type) {
  if (!container) return;
  let dragId = null;
  container.addEventListener('dragstart', function (e) {
    const el = e.target.closest('[data-drag]');
    if (!el) return;
    dragId = el.dataset.drag;
    el.classList.add('opacity-40');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', dragId); } catch (err) {}
  });
  container.addEventListener('dragend', function () {
    dragId = null;
    render();
  });
  container.addEventListener('dragover', function (e) {
    if (!dragId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    $$('[data-drop]', container).forEach(function (n) { n.removeAttribute('data-drop'); });
    const el = e.target.closest('[data-drag]');
    if (el && el.dataset.drag !== dragId) {
      const r = el.getBoundingClientRect();
      el.dataset.drop = e.clientY < r.top + r.height / 2 ? 'before' : 'after';
    }
  });
  container.addEventListener('drop', function (e) {
    if (!dragId) return;
    e.preventDefault();
    const el = e.target.closest('[data-drag]');
    if (!el || !el.dataset.drag || el.dataset.drag === dragId) { dragId = null; render(); return; }
    const sourceId = dragId;
    const targetId = el.dataset.drag;
    const after = el.dataset.drop === 'after';
    dragId = null;
    if (type === 'workflow') reorderWorkflow(sourceId, targetId, after);
    else reorderStep(state.activeWorkflowId, sourceId, targetId, after);
  });
}

function reorderWorkflow(sourceId, targetId, after) {
  const from = state.workflows.findIndex(function (w) { return w.id === sourceId; });
  const target = state.workflows.findIndex(function (w) { return w.id === targetId; });
  if (from < 0 || target < 0 || from === target) return;
  const item = state.workflows.splice(from, 1)[0];
  let insert = target + (after ? 1 : 0);
  if (from < insert) insert -= 1;
  insert = Math.max(0, Math.min(state.workflows.length, insert));
  state.workflows.splice(insert, 0, item);
  save(); render();
}

function reorderStep(wfId, sourceId, targetId, after) {
  const wf = workflowById(wfId);
  if (!wf) return;
  const from = wf.steps.findIndex(function (s) { return s.id === sourceId; });
  const target = wf.steps.findIndex(function (s) { return s.id === targetId; });
  if (from < 0 || target < 0 || from === target) return;
  const item = wf.steps.splice(from, 1)[0];
  let insert = target + (after ? 1 : 0);
  if (from < insert) insert -= 1;
  insert = Math.max(0, Math.min(wf.steps.length, insert));
  wf.steps.splice(insert, 0, item);
  wf.updatedAt = Date.now();
  save(); render();
}
